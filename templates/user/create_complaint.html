{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">

    <div class="card card-ct overflow-hidden">
      <div class="card-ct-header text-center">
        <div class="h4 mb-0 fw-700">Raise a Complaint</div>
        <div class="text-muted small mt-1 fw-500">Report civic issues in your area</div>
      </div>
      <div class="card-body p-4">

        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}

          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-500">Complaint Title</label>
              {{ form.title }}
            </div>

            <div class="col-md-6">
              <label class="form-label fw-500">Department</label>
              {{ form.department }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-500">Category</label>
              {{ form.category }}
            </div>

            <div class="col-12">
              <label class="form-label fw-500">Description</label>
              {{ form.description }}
            </div>

            <div class="col-md-6">
              <label class="form-label fw-500">Priority</label>
              {{ form.priority }}
            </div>
            <div class="col-md-6">
              <label class="form-label fw-500">Upload Image (optional)</label>
              {{ form.user_image }}
            </div>
          </div>

          <hr class="my-4">

          <div class="d-flex justify-content-between gap-2">
            <a href="{% url 'user_dashboard' %}" class="btn btn-outline-secondary">Back</a>
            <button type="submit" class="btn btn-ct-primary px-4">Submit Complaint</button>
          </div>
        </form>

      </div>
    </div>

  </div>
</div>
{% endblock %}
